version: 2
updates:
  # The only dependencies are the SHA-pinned actions in workflows (no npm runtime deps).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Don't propose a version pnpm's minimumReleaseAge (pnpm-workspace.yaml) would
    # refuse to install for 7 days.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # preview.yml references this repo's own actions by the moving major tag (@v1).
      - dependency-name: Wave-RF/cloudflare-preview
    commit-message:
      prefix: ci
