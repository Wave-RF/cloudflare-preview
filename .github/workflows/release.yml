name: Release

# Release-on-merge: every push to main runs semantic-release, which reads the
# Conventional-Commit subjects since the last vX.Y.Z tag and either cuts a release
# (tag + GitHub Release) or does nothing. Then, if it released, the major tag (v1)
# is force-moved to the released commit, which is what
# `uses: Wave-RF/cloudflare-preview@v1` resolves. See .releaserc.json and RELEASING.md.
#
# Nothing is committed back to main (it is protected): the git tag is the version.
# Auth is the built-in GITHUB_TOKEN; there are no other secrets.

on:
  push:
    branches: [main]
  # Manual re-run. A push made with GITHUB_TOKEN (Dependabot auto-merge) starts no
  # workflow, so a release-worthy commit can be left unreleased; see RELEASING.md.
  workflow_dispatch:

permissions: {}

# Releases are strictly serial and an in-flight release is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the vX.Y.Z tag, the moving vX tag, create the Release
      issues: write # success comments / "release failed" issue
      pull-requests: write # success comments on released PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
          persist-credentials: false # it authenticates with GITHUB_TOKEN itself

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.1.3"
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Build the release from the committed pnpm-lock.yaml: the tree CI tested. The release
      # tooling is also pinned to exact versions in package.json.
      - run: pnpm install --frozen-lockfile

      # A red main never releases. (Linting runs in ci.yml, which has actionlint.)
      - run: node --test test/*.test.mjs
      - run: pnpm run check:release

      - id: release
        name: Release
        run: node scripts/release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Move the major tag
        if: ${{ steps.release.outputs.released == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAJOR: ${{ steps.release.outputs.major }}
          SHA: ${{ steps.release.outputs.sha }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          case "$MAJOR" in ''|*[!0-9]*) echo "::error::unexpected major '$MAJOR'"; exit 1 ;; esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "v$MAJOR" -m "v$MAJOR -> $TAG" "$SHA"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v$MAJOR"
