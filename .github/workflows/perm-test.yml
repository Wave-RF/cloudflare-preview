# TEMPORARY — settles #1, never merged. Runs the comment action holding only
# pull-requests: write (no issues: write) and fails on any GitHub API error.
name: perm-test
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  comment:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: c
        uses: ./comment
        with:
          marker: "<!-- perm-test -->"
          body: "permissions test (#1): pull-requests write only, run ${{ github.run_id }} attempt ${{ github.run_attempt }}"
          fail-on-error: "true"
      - run: echo "action=${{ steps.c.outputs.action }} id=${{ steps.c.outputs.comment-id }}"
